<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Coordenadas no encontradas | G2R Mining Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="website icon" href="Web G2R/imagenes/logo-secundario.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #6caf2c;
      --green2:  #4e8a1a;
      --dark:    #0f1410;
      --dark2:   #1a2218;
      --white:   #f4f7f2;
      --gray:    #8a9e84;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--white);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    /* ── Topo SVG background ── */
    .topo-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.18;
    }

    .topo-line {
      fill: none;
      stroke: var(--green);
      stroke-width: 1.2;
      animation: pulse 4s ease-in-out infinite;
    }
    .topo-line:nth-child(2)  { animation-delay: 0.3s; stroke-width: 0.8; opacity: 0.7; }
    .topo-line:nth-child(3)  { animation-delay: 0.6s; stroke-width: 1.4; }
    .topo-line:nth-child(4)  { animation-delay: 0.9s; stroke-width: 0.6; opacity: 0.5; }
    .topo-line:nth-child(5)  { animation-delay: 1.2s; stroke-width: 1.0; }
    .topo-line:nth-child(6)  { animation-delay: 1.5s; stroke-width: 0.7; opacity: 0.6; }
    .topo-line:nth-child(7)  { animation-delay: 1.8s; stroke-width: 1.3; }
    .topo-line:nth-child(8)  { animation-delay: 2.1s; stroke-width: 0.9; }
    .topo-line:nth-child(9)  { animation-delay: 2.4s; stroke-width: 0.5; opacity: 0.4; }
    .topo-line:nth-child(10) { animation-delay: 2.7s; stroke-width: 1.1; }
    .topo-line:nth-child(11) { animation-delay: 3.0s; stroke-width: 0.8; opacity: 0.6; }
    .topo-line:nth-child(12) { animation-delay: 3.3s; stroke-width: 1.5; }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 1;   }
    }

    /* Grid overlay */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(108,175,44,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,175,44,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
    }

    /* Vignette */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, var(--dark) 90%);
      z-index: 1;
    }

    /* ── Content ── */
    .container {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      animation: fadeIn 0.8s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .logo-wrap {
      margin-bottom: 2.5rem;
      animation: fadeIn 0.8s 0.1s ease both;
    }
    .logo-wrap img {
      height: 52px;
      filter: brightness(0) invert(1);
      opacity: 0.9;
    }

    /* Pin animation */
    .pin-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 1.5rem;
      animation: dropIn 0.7s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-60px) scale(0.5); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .pin-wrap svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 24px rgba(108,175,44,0.5));
      animation: pinFloat 3s ease-in-out infinite;
    }

    @keyframes pinFloat {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    .pin-shadow {
      width: 30px;
      height: 8px;
      background: radial-gradient(ellipse, rgba(108,175,44,0.4), transparent 70%);
      border-radius: 50%;
      margin: 0 auto;
      animation: shadowPulse 3s ease-in-out infinite;
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1);   opacity: 0.5; }
      50%       { transform: scaleX(0.6); opacity: 0.2; }
    }

    /* 404 number */
    .error-code {
      font-family: 'Righteous', sans-serif;
      font-size: clamp(6rem, 18vw, 13rem);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 2px var(--green);
      letter-spacing: -4px;
      margin-bottom: 0.2rem;
      animation: fadeIn 0.8s 0.4s ease both;
      text-shadow: 0 0 60px rgba(108,175,44,0.15);
    }

    /* Coordinates badge */
    .coords {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(108,175,44,0.1);
      border: 1px solid rgba(108,175,44,0.3);
      border-radius: 999px;
      padding: 0.35rem 1rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 1.5rem;
      animation: fadeIn 0.8s 0.5s ease both;
    }
    .coords::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 1.2s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* Heading */
    .heading {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 600;
      color: var(--white);
      margin-bottom: 0.75rem;
      animation: fadeIn 0.8s 0.6s ease both;
    }

    .subheading {
      font-size: clamp(0.85rem, 2vw, 1rem);
      font-weight: 300;
      color: var(--gray);
      max-width: 440px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
      animation: fadeIn 0.8s 0.7s ease both;
    }

    /* Button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 0.85rem 2rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(108,175,44,0.35);
      animation: fadeIn 0.8s 0.85s ease both;
    }
    .btn:hover {
      background: var(--green2);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(108,175,44,0.45);
    }
    .btn:active { transform: scale(0.97); }

    .btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Footer note */
    .note {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.72rem;
      color: rgba(138,158,132,0.5);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .error-code { -webkit-text-stroke-width: 1.5px; }
      .pin-wrap { width: 60px; height: 60px; }
    }
  </style>
</head>
<body>

<!-- Topographic SVG background -->
<svg class="topo-bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer contours — large sweeping curves across full viewport -->
  <path class="topo-line" d="M-100,450 C100,200 300,650 500,400 C700,150 900,600 1100,350 C1300,100 1450,500 1600,300"/>
  <path class="topo-line" d="M-100,480 C150,230 350,680 550,430 C750,180 950,630 1150,380 C1350,130 1480,520 1640,320"/>
  <path class="topo-line" d="M-100,420 C80,170 280,620 480,370 C680,120 880,570 1080,320 C1280,70 1420,470 1580,270"/>
  <path class="topo-line" d="M-100,510 C200,260 400,710 600,460 C800,210 1000,660 1200,410 C1400,160 1520,550 1680,350"/>
  <!-- Inner contours — tighter, smaller amplitude -->
  <path class="topo-line" d="M-100,460 C120,310 320,580 520,420 C720,260 920,520 1120,370 C1320,220 1450,490 1600,340"/>
  <path class="topo-line" d="M-100,440 C100,330 300,540 500,410 C700,280 900,500 1100,380 C1300,260 1440,460 1600,330"/>
  <!-- Upper zone contours -->
  <path class="topo-line" d="M-100,200 C200,80 500,320 750,180 C1000,40 1200,280 1440,150 C1480,130 1520,160 1560,140"/>
  <path class="topo-line" d="M-100,240 C220,120 520,360 770,220 C1020,80 1220,320 1460,190"/>
  <!-- Lower zone contours -->
  <path class="topo-line" d="M-100,700 C200,580 500,820 750,680 C1000,540 1200,780 1440,650"/>
  <path class="topo-line" d="M-100,740 C220,620 520,860 770,720 C1020,580 1220,820 1460,690"/>
  <!-- Fine detail lines -->
  <path class="topo-line" d="M200,0 C220,100 180,200 200,300 C220,400 180,500 200,600 C220,700 180,800 200,900"/>
  <path class="topo-line" d="M900,0 C920,100 880,200 900,300 C920,400 880,500 900,600 C920,700 880,800 900,900"/>
</svg>

<div class="grid-bg"></div>
<div class="vignette"></div>

<div class="container">
  <!-- Logo -->
  <div class="logo-wrap">
    <img src="Web G2R/imagenes/logo-principal.webp" alt="G2R Mining Solutions">
  </div>

  <!-- Pin -->
  <div class="pin-wrap">
    <svg viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="pinGrad" cx="40%" cy="30%">
          <stop offset="0%" stop-color="#8fd44a"/>
          <stop offset="100%" stop-color="#4e8a1a"/>
        </radialGradient>
      </defs>
      <!-- Pin body -->
      <path d="M32 4C19.3 4 9 14.3 9 27C9 42.5 32 72 32 72C32 72 55 42.5 55 27C55 14.3 44.7 4 32 4Z"
            fill="url(#pinGrad)" stroke="#3a6e12" stroke-width="1.5"/>
      <!-- Inner circle — "blank zone" -->
      <circle cx="32" cy="27" r="10" fill="#0f1410" opacity="0.85"/>
      <!-- Question mark -->
      <text x="32" y="32" text-anchor="middle" font-family="Poppins,sans-serif"
            font-size="13" font-weight="700" fill="#6caf2c">?</text>
    </svg>
  </div>
  <div class="pin-shadow"></div>

  <!-- 404 -->
  <div class="error-code">404</div>

  <!-- Coords badge -->
  <div class="coords" id="coords-badge">COORDENADAS NO ENCONTRADAS</div>

  <!-- Text -->
  <h1 class="heading" id="main-heading">Esta zona aún no ha sido explorada</h1>
  <p class="subheading" id="main-sub">
    La página que buscás no existe o fue movida a otra ubicación.
    Volvé al área conocida y continuá explorando.
  </p>

  <!-- Button -->
  <a href="/" class="btn" id="main-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    <span id="btn-text">Volver al área conocida</span>
  </a>
</div>

<p class="note">G2R Mining Solutions © 2024</p>

<script>
  // ── Bilingual based on localStorage ──
  const translations = {
    es: {
      title:   '404 — Coordenadas no encontradas | G2R Mining Solutions',
      coords:  'COORDENADAS NO ENCONTRADAS',
      heading: 'Esta zona aún no ha sido explorada',
      sub:     'La página que buscás no existe o fue movida a otra ubicación. Volvé al área conocida y continuá explorando.',
      btn:     'Volver al área conocida'
    },
    en: {
      title:   '404 — Coordinates not found | G2R Mining Solutions',
      coords:  'COORDINATES NOT FOUND',
      heading: 'This area has not yet been explored',
      sub:     'The page you are looking for does not exist or has been moved. Return to the known area and keep exploring.',
      btn:     'Return to known area'
    }
  };

  const lang = localStorage.getItem('g2r-language') || 'es';
  const t = translations[lang] || translations.es;

  document.title                              = t.title;
  document.getElementById('coords-badge').textContent = t.coords;
  document.getElementById('main-heading').textContent = t.heading;
  document.getElementById('main-sub').textContent     = t.sub;
  document.getElementById('btn-text').textContent     = t.btn;
  document.documentElement.lang = lang;
</script>

</body>
</html>
