<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacto</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://smtpjs.com/v3/smtp.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0;
    }

    .contact-card {
      display: grid;
      grid-template-columns: 57fr 43fr;
      width: 100%;
      height: 10vh;
    }

    /* PANEL IZQUIERDO - Formulario */
    .form-panel {
      background: #fff;
      padding: 60px 70px 60px 60px;
    }

    .form-panel h2 {
      font-size: 20px;
      font-weight: 600;
      color: #2D2DE8;
      margin-bottom: 36px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 28px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 500;
      color: #444;
      letter-spacing: 0.3px;
    }

    .form-group input,
    .form-group textarea {
      border: none;
      border-bottom: 1.5px solid #ddd;
      padding: 8px 2px;
      font-size: 13px;
      font-family: 'Poppins', sans-serif;
      color: #333;
      outline: none;
      background: transparent;
      transition: border-color 0.2s;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #bbb;
      font-size: 13px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-bottom-color: #2D2DE8;
    }

    .form-group textarea {
      resize: none;
      min-height: 90px;
    }

    .btn-send {
      margin-top: 32px;
      background: #2D2DE8;
      color: #fff;
      border: none;
      padding: 13px 40px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-send:hover { background: #1a1ac4; }
    .btn-send:active { transform: scale(0.97); }
    .btn-send:disabled { background: #aaa; cursor: not-allowed; }

    /* PANEL DERECHO - Información */
    .info-panel {
      background: #2D2DE8;
      padding: 60px 50px;
      
      color: #fff;
    }

    .info-panel h2 {
      font-size: 40px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 40px;
    }

    .info-item {
      display: grid;
      grid-template-columns: 90px 1fr;
      margin-bottom: 28px;
      align-items: start;
    }

    .info-label {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      padding-top: 1px;
    }

    .info-value {
      font-size: 14px;
      color: #d0d0ff;
      line-height: 1.7;
    }

    .info-value a {
      color: #d0d0ff;
      text-decoration: none;
    }

    .social-links {
      display: flex;
      gap: 14px;
      margin-top: 48px;
    }

    .social-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
    }

    .social-icon:hover { background: rgba(255,255,255,0.3); }

    .social-icon svg {
      width: 16px;
      height: 16px;
      fill: #fff;
    }

    /* Errores de validación */
    .field-error {
      font-size: 11px;
      color: #e74c3c;
      margin-top: 3px;
      display: none;
    }

    .form-group.has-error input,
    .form-group.has-error textarea {
      border-bottom-color: #e74c3c;
    }

    .form-group.has-error .field-error {
      display: block;
    }

    /* RESPONSIVE - Tablet */
    @media (max-width: 900px) {
      .contact-card {
        grid-template-columns: 1fr;
        min-height: unset;
      }
      .form-row {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .form-panel { padding: 48px 40px 40px; }
      .info-panel { padding: 48px 40px 52px; }
      .social-links { margin-top: 32px; }
    }

    /* RESPONSIVE - Móvil */
    @media (max-width: 480px) {
      .form-panel { padding: 36px 24px 32px; }
      .info-panel { padding: 36px 24px 44px; }
      .form-panel h2, .info-panel h2 { font-size: 17px; }
      .btn-send { width: 100%; text-align: center; }
      .info-item { grid-template-columns: 80px 1fr; }
    }
  </style>
</head>
<body>

<div class="contact-card">

  <!-- PANEL FORMULARIO -->
  <div class="form-panel">
    <h2>Envianos tu consulta</h2>

    <div class="form-row">
      <div class="form-group" id="group-nombre">
        <label>Nombre</label>
        <input type="text" id="nombre" placeholder="Juan García" />
        <span class="field-error">Por favor ingresá tu nombre.</span>
      </div>
      <div class="form-group" id="group-telefono">
        <label>Teléfono</label>
        <input type="text" id="telefono" placeholder="+54 11 0000 0000" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" id="group-email">
        <label>Email</label>
        <input type="email" id="email" placeholder="juan@ejemplo.com" />
        <span class="field-error">Ingresá un email válido.</span>
      </div>
      <div class="form-group" id="group-asunto">
        <label>Asunto</label>
        <input type="text" id="asunto" placeholder="Consulta sobre producto" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group full" id="group-mensaje">
        <label>Mensaje</label>
        <textarea id="mensaje" placeholder="Escribí tu mensaje acá..."></textarea>
        <span class="field-error">Por favor escribí tu mensaje.</span>
      </div>
    </div>

    <button class="btn-send" onclick="enviar()">ENVIAR</button>
  </div>

  <!-- PANEL INFORMACIÓN -->
  <div class="info-panel">
    <h2>Contactanos</h2>

    <div class="info-item">
      <span class="info-label">Email</span>
      <span class="info-value"><a href="mailto:contacto@ejemplo.com">contacto@ejemplo.com</a></span>
    </div>

    <div class="info-item">
      <span class="info-label">Teléfono</span>
      <span class="info-value">+54 11 0000 0000</span>
    </div>

    <div class="info-item">
      <span class="info-label">Dirección</span>
      <span class="info-value">
        Av. Corrientes 1234, Piso 3<br>
        Ciudad Autónoma de Buenos Aires<br>
        Argentina
      </span>
    </div>

    <div class="social-links">
      <a class="social-icon" href="#" aria-label="Twitter">
        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.261 5.636zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <a class="social-icon" href="#" aria-label="Facebook">
        <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      </a>
      <a class="social-icon" href="#" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </a>
      <a class="social-icon" href="#" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
    </div>
  </div>

</div>

<script>
  function validar() {
    let valido = true;
    document.querySelectorAll('.form-group').forEach(g => g.classList.remove('has-error'));

    if (!document.getElementById('nombre').value.trim()) {
      document.getElementById('group-nombre').classList.add('has-error');
      valido = false;
    }

    const emailVal = document.getElementById('email').value.trim();
    const emailReg = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailVal || !emailReg.test(emailVal)) {
      document.getElementById('group-email').classList.add('has-error');
      valido = false;
    }

    if (!document.getElementById('mensaje').value.trim()) {
      document.getElementById('group-mensaje').classList.add('has-error');
      valido = false;
    }

    return valido;
  }

  function enviar() {
    if (!validar()) return;

    const btn = document.querySelector('.btn-send');
    btn.disabled = true;
    btn.textContent = 'ENVIANDO...';

    const nombre   = document.getElementById('nombre').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const email    = document.getElementById('email').value.trim();
    const asunto   = document.getElementById('asunto').value.trim();
    const mensaje  = document.getElementById('mensaje').value.trim();

    /*
     * ────────────────────────────────────────────────────────────
     *  CONFIGURACIÓN SMTPJS + ELASTIC EMAIL
     *
     *  1. Creá una cuenta gratis en https://elasticemail.com
     *  2. Ve a Settings → SMTP/API → Generate API Key (SMTP)
     *  3. Generá tu SecureToken en https://smtpjs.com
     *     (clic en "Encrypt your SMTP credentials")
     *  4. Reemplazá los tres valores marcados abajo
     * ────────────────────────────────────────────────────────────
     */

    Email.send({
      SecureToken: "TU_SECURE_TOKEN_AQUI",    // <-- reemplazá esto
      To:          "TU_EMAIL_AQUI@gmail.com",  // <-- reemplazá esto
      From:        "TU_EMAIL_AQUI@gmail.com",  // <-- mismo email verificado
      Subject:     asunto || "Nueva consulta de contacto",
      Body:
        `<h3>Nueva consulta de contacto</h3>
         <p><strong>Nombre:</strong> ${nombre}</p>
         <p><strong>Email:</strong> ${email}</p>
         <p><strong>Teléfono:</strong> ${telefono || "No especificado"}</p>
         <p><strong>Asunto:</strong> ${asunto || "Sin asunto"}</p>
         <p><strong>Mensaje:</strong><br>${mensaje.replace(/\n/g, '<br>')}</p>`
    }).then(result => {
      btn.disabled = false;
      btn.textContent = 'ENVIAR';

      if (result === "OK") {
        Swal.fire({
          icon: 'success',
          title: '¡Mensaje enviado!',
          text: 'Nos pondremos en contacto a la brevedad.',
          confirmButtonColor: '#2D2DE8',
          confirmButtonText: 'Cerrar'
        });
        ['nombre','telefono','email','asunto','mensaje'].forEach(id => {
          document.getElementById(id).value = '';
        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Error al enviar',
          text: 'Revisá la configuración de SMTPJS. Detalle: ' + result,
          confirmButtonColor: '#2D2DE8',
          confirmButtonText: 'Cerrar'
        });
      }
    });
  }
</script>

</body>
</html>
